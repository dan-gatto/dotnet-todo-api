apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapi-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todoapi
  template:
    metadata:
      labels:
        app: todoapi
    spec:
      containers:
        - name: todoapi
          image: dockerdgatto/todoapi:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: todoapi-service
spec:
  type: LoadBalancer
  selector:
    app: todoapi
  ports:
    - port: 8080
      targetPort: 8080