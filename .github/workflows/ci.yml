name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore TodoApi/TodoApi.csproj

      - name: Build
        run: dotnet build TodoApi/TodoApi.csproj --no-restore --configuration Release

      - name: Build Docker image
        run: docker build -t todoapi ./TodoApi